name: Live job feed
# Adds currently open jobs (with real apply links) once a day. Jobs that disappear from the feed
# stop counting as open after 3 days.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python cli.py ingest-live --pages 3
      - run: python cli.py stats
