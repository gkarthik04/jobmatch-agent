# Render Blueprint: New + > Blueprint > pick this repo. Secrets (sync: false) are entered in the
# Render dashboard, never committed.
services:
  - type: web
    name: jobmatch-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL        # Neon connection string
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMBED_PROVIDER
        value: local
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBED_DIM
        value: "384"
      - key: CHAT_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview,gemini-2.5-flash
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "15"
