<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobMatch Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a2030; --mute:#667085; --line:#e4e7ec; --brand:#4f46e5;
          --good:#067647; --goodbg:#ecfdf3; --warn:#b54708; --warnbg:#fffaeb; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#161b22; --ink:#e6e8ee; --mute:#9aa4b2; --line:#2a313c; --brand:#8b83ff;
            --good:#6ce9a6; --goodbg:#0b2a1c; --warn:#fec84b; --warnbg:#2b2108; --bad:#fda29b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; } header h1 span { color:var(--brand); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  nav button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%; }
  button.primary { background:var(--brand); color:#fff; border:0; padding:9px 16px; border-radius:8px; cursor:pointer; font:inherit; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); padding:6px 10px; border-radius:8px; cursor:pointer; font:inherit; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; } .row > * { flex:1 1 auto; } .row > .fit { flex:0 0 auto; }
  .chip { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12.5px; margin:2px 4px 2px 0; border:1px solid var(--line); }
  .chip.good { background:var(--goodbg); color:var(--good); border-color:transparent; }
  .chip.warn { background:var(--warnbg); color:var(--warn); border-color:transparent; }
  .muted { color:var(--mute); font-size:13.5px; } .err { color:var(--bad); }
  .job h3 { margin:0 0 2px; font-size:16px; } .job .actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .score { font-weight:700; font-size:20px; } .bar { height:6px; background:var(--line); border-radius:4px; width:90px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--brand); }
  .chat { height:420px; overflow:auto; display:flex; flex-direction:column; gap:10px; padding:4px; }
  .msg { max-width:88%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--brand); color:#fff; } .msg.bot { align-self:flex-start; background:var(--bg); border:1px solid var(--line); }
  details { margin-top:6px; font-size:13px; } summary { cursor:pointer; color:var(--mute); }
  .tool { font-family:ui-monospace,Consolas,monospace; font-size:12px; padding:3px 0; } .tool.fail { color:var(--bad); }
  .hidden { display:none; } .auth { max-width:380px; margin:50px auto; } .auth input { margin-bottom:10px; }
  h2 { margin:0 0 10px; font-size:16px; } .tag { font-size:11px; padding:1px 7px; border-radius:6px; background:var(--line); margin-left:6px; }
</style>
</head>
<body>
<header><h1>Job<span>Match</span> Agent</h1><div id="who" class="muted"></div></header>
<main>
  <section id="auth" class="card auth hidden">
    <h2 id="authTitle">Log in</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
    <div class="row"><button class="primary" id="authBtn">Log in</button><button class="ghost" id="authSwitch">Need an account? Sign up</button></div>
    <p id="authErr" class="err"></p>
  </section>

  <section id="app" class="hidden">
    <nav id="tabs">
      <button data-t="profile" class="on">Profile</button><button data-t="matches">Matches</button>
      <button data-t="chat">Agent chat</button><button data-t="search">Search</button>
      <button data-t="saved">Saved</button><button id="logout" style="margin-left:auto">Log out</button>
    </nav>

    <div id="t-profile" class="tab">
      <div class="card">
        <h2>Your resume</h2>
        <p class="muted">Upload a text-based PDF. Gemini extracts a structured profile (validated against a schema).</p>
        <div class="row"><input id="file" type="file" accept="application/pdf"><button class="primary fit" id="upload">Upload &amp; parse</button></div>
        <p id="upErr" class="err"></p>
      </div>
      <div id="profileView"></div>
    </div>

    <div id="t-matches" class="tab hidden">
      <div class="card row">
        <label class="fit"><input type="checkbox" id="mRemote" style="width:auto"> Remote only</label>
        <button class="primary fit" id="loadMatches">Find my matches</button>
        <span class="muted">Like / dislike a job and re-run: your preference vector reshapes the ranking.</span>
      </div>
      <div id="matchList"></div>
    </div>

    <div id="t-chat" class="tab hidden">
      <div class="card">
        <div id="chat" class="chat"></div>
        <div class="row" style="margin-top:10px">
          <input id="chatIn" placeholder="e.g. find remote python backend jobs, then compare the 2nd one with my resume" maxlength="2000">
          <button class="primary fit" id="chatSend">Send</button><button class="ghost fit" id="chatReset">Clear</button>
        </div>
      </div>
    </div>

    <div id="t-search" class="tab hidden">
      <div class="card">
        <div class="row"><input id="q" placeholder="Search jobs, e.g. data analyst sql tableau"><button class="primary fit" id="doSearch">Search</button></div>
        <div class="row" style="margin-top:8px">
          <select id="mode"><option value="hybrid">Hybrid (full-text + vector, RRF)</option><option value="hybrid_rerank">Hybrid + LLM rerank</option><option value="vector">Vector only</option><option value="fts">Full-text only</option></select>
          <input id="loc" placeholder="Location contains…"><label class="fit"><input type="checkbox" id="sRemote" style="width:auto"> Remote</label>
        </div>
      </div>
      <div id="searchList"></div>
    </div>

    <div id="t-saved" class="tab hidden"><div id="savedList"></div></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = null; try { token = localStorage.getItem("jm_token"); } catch (e) {}
let signup = false;

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (token) headers.Authorization = "Bearer " + token;
  if (opts.json) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 204) return null;
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); }
  if (!r.ok) throw new Error(data.error?.message || ("Request failed (" + r.status + ")"));
  return data;
}
function show() {
  $("#auth").classList.toggle("hidden", !!token);
  $("#app").classList.toggle("hidden", !token);
  $("#who").textContent = token ? "" : "";
  if (token) { loadProfile(); loadChat(); loadSaved(); }
}
function logout() { token = null; try { localStorage.removeItem("jm_token"); } catch (e) {} show(); }
$("#logout").onclick = logout;
$("#authSwitch").onclick = () => { signup = !signup; $("#authTitle").textContent = signup ? "Sign up" : "Log in";
  $("#authBtn").textContent = signup ? "Create account" : "Log in"; $("#authSwitch").textContent = signup ? "Have an account? Log in" : "Need an account? Sign up"; };
$("#authBtn").onclick = async () => {
  $("#authErr").textContent = "";
  try {
    const d = await api(signup ? "/auth/signup" : "/auth/login", { method: "POST", json: { email: $("#email").value, password: $("#password").value } });
    token = d.access_token; try { localStorage.setItem("jm_token", token); } catch (e) {}
    show();
  } catch (e) { $("#authErr").textContent = e.message; }
};
$("#tabs").addEventListener("click", e => {
  const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll("#tabs button[data-t]").forEach(b => b.classList.toggle("on", b === e.target));
  document.querySelectorAll(".tab").forEach(x => x.classList.add("hidden")); $("#t-" + t).classList.remove("hidden");
  if (t === "saved") loadSaved();
});

const chips = (arr, cls = "") => (arr || []).map(s => `<span class="chip ${cls}">${esc(s)}</span>`).join("");
async function loadProfile() {
  try {
    const p = await api("/profile");
    $("#profileView").innerHTML = `<div class="card"><h2>${esc(p.name)} <span class="tag">${p.experience_years} yrs experience</span></h2>
      <p><b>Skills</b><br>${chips(p.skills)}</p><p><b>Target roles</b><br>${chips(p.preferred_roles)}</p>
      <p><b>Locations</b><br>${chips(p.preferred_locations) || '<span class="muted">none stated</span>'}</p>
      <p><b>Education</b><br>${p.education.map(e => esc(`${e.degree} — ${e.institution}${e.year ? " (" + e.year + ")" : ""}`)).join("<br>")}</p>
      <p><b>Projects</b></p>${p.projects.map(x => `<p style="margin:4px 0"><b>${esc(x.name)}</b> <span class="muted">${esc(x.description)}</span><br>${chips(x.technologies)}</p>`).join("")}</div>`;
  } catch (e) { $("#profileView").innerHTML = `<p class="muted">No profile yet. Upload your resume above.</p>`; }
}
$("#upload").onclick = async () => {
  const f = $("#file").files[0]; $("#upErr").textContent = ""; if (!f) { $("#upErr").textContent = "Choose a PDF first."; return; }
  const fd = new FormData(); fd.append("file", f); $("#upload").disabled = true; $("#upload").textContent = "Parsing…";
  try { await api("/resume", { method: "POST", body: fd }); await loadProfile(); } catch (e) { $("#upErr").textContent = e.message; }
  $("#upload").disabled = false; $("#upload").textContent = "Upload & parse";
};

function jobCard(j, m) {
  const posted = j.posted_at ? new Date(j.posted_at).toLocaleDateString() : "";
  const fit = m ? `<div class="fit"><div class="score">${m.fit_score}<span class="muted">/100</span></div><div class="bar"><i style="width:${m.fit_score}%"></i></div></div>` : "";
  return `<div class="card job" data-id="${j.id}"><div class="row"><div><h3>${esc(j.title)}</h3>
    <div class="muted">${esc(j.company || "")} · ${esc(j.location || "")}${j.remote ? ' <span class="tag">remote</span>' : ""} ${posted ? "· " + posted : ""} · id ${j.id}</div></div>${fit}</div>
    ${m ? `<p>${esc(m.why_it_matches)}</p><div>${chips(m.matched_skills, "good")}${chips(m.missing_skills, "warn")}</div>` : `<p class="muted">${esc(j.snippet)}…</p><div>${chips(j.skills)}</div>`}
    <div class="actions">${m ? `<button class="ghost" data-fb="1">👍 Like</button><button class="ghost" data-fb="0">👎 Dislike</button>` : ""}
    <button class="ghost" data-save="1">☆ Save</button>
    ${!m && j.ranks ? `<span class="muted">ranks: ${esc(Object.entries(j.ranks).map(([k, v]) => k + " #" + v).join(", "))}${j.rerank_score != null ? " · rerank " + j.rerank_score : ""}</span>` : ""}</div></div>`;
}
async function jobAction(e) {
  const card = e.target.closest(".job"); if (!card) return; const id = +card.dataset.id;
  try {
    if (e.target.dataset.fb != null) { await api("/feedback", { method: "POST", json: { job_id: id, liked: e.target.dataset.fb === "1" } }); e.target.textContent = e.target.dataset.fb === "1" ? "👍 Liked" : "👎 Disliked"; }
    if (e.target.dataset.save) { await api("/saved", { method: "POST", json: { job_id: id } }); e.target.textContent = "★ Saved"; }
    if (e.target.dataset.unsave) { await api("/saved/" + id, { method: "DELETE" }); card.remove(); }
  } catch (err) { alert(err.message); }
}
["#matchList", "#searchList", "#savedList"].forEach(s => $(s).addEventListener("click", jobAction));

$("#loadMatches").onclick = async () => {
  const b = $("#loadMatches"); b.disabled = true; b.textContent = "Ranking…"; $("#matchList").innerHTML = '<p class="muted">Hybrid search → rerank → explaining matches…</p>';
  try {
    const rows = await api("/matches?limit=10" + ($("#mRemote").checked ? "&remote=true" : ""));
    $("#matchList").innerHTML = rows.length ? rows.map(m => jobCard(m.job, m)).join("") : '<p class="muted">No matches found.</p>';
  } catch (e) { $("#matchList").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  b.disabled = false; b.textContent = "Find my matches";
};
$("#doSearch").onclick = async () => {
  const p = new URLSearchParams({ q: $("#q").value, mode: $("#mode").value, limit: 10 });
  if ($("#loc").value) p.set("location", $("#loc").value); if ($("#sRemote").checked) p.set("remote", "true");
  $("#searchList").innerHTML = '<p class="muted">Searching…</p>';
  try { const d = await api("/search?" + p); $("#searchList").innerHTML = d.results.map(j => jobCard(j, null)).join("") || '<p class="muted">No results.</p>'; }
  catch (e) { $("#searchList").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
};
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") $("#doSearch").click(); });
async function loadSaved() {
  try { const rows = await api("/saved");
    $("#savedList").innerHTML = rows.length ? rows.map(j => jobCard(j, null).replace('data-save="1">☆ Save', 'data-unsave="1">✕ Remove')).join("") : '<p class="muted">Nothing saved yet — save jobs from Matches, Search, or ask the agent.</p>'; } catch (e) {}
}

function addMsg(role, text, extra) {
  const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "user" : "bot"); d.textContent = text;
  if (extra) d.appendChild(extra); $("#chat").appendChild(d); $("#chat").scrollTop = 1e9; return d;
}
function toolPanel(res) {
  const tools = res.steps.filter(s => s.kind === "tool"); const u = res.usage;
  const det = document.createElement("details");
  const plan = res.steps.find(s => s.kind === "llm" && s.text && res.steps.some(t => t.kind === "tool"));
  det.innerHTML = `<summary>${tools.length ? "🔧 " + tools.map(t => t.name).join(" → ") : "no tools used"} · ${u.llm_calls} LLM call(s) · ${u.prompt_tokens + u.output_tokens} tokens · ${u.latency_ms} ms</summary>` +
    (plan ? `<div class="muted">Plan: ${esc(plan.text)}</div>` : "") +
    tools.map(t => `<div class="tool ${t.ok ? "" : "fail"}">${t.ok ? "✓" : "✗"} step ${t.step}: ${esc(t.name)}(${esc(JSON.stringify(t.args))}) · ${Math.round(t.latency_ms)} ms${t.error ? " · " + esc(t.error) : ""}</div>`).join("");
  return det;
}
async function loadChat() {
  try { const h = await api("/chat/history"); $("#chat").innerHTML = ""; h.forEach(m => addMsg(m.role, m.content));
    if (!h.length) addMsg("bot", "Hi! I can search the jobs index, compare jobs to your resume, and save jobs for you. Try: “find remote data analyst jobs”."); } catch (e) {}
}
async function send() {
  const t = $("#chatIn").value.trim(); if (!t) return; $("#chatIn").value = ""; addMsg("user", t);
  const wait = addMsg("bot", "Thinking…"); $("#chatSend").disabled = true;
  try { const r = await api("/chat", { method: "POST", json: { message: t } }); wait.remove(); addMsg("bot", r.reply, toolPanel(r)); loadSaved(); }
  catch (e) { wait.textContent = "Error: " + e.message; }
  $("#chatSend").disabled = false;
}
$("#chatSend").onclick = send; $("#chatIn").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("#chatReset").onclick = async () => { await api("/chat/history", { method: "DELETE" }); loadChat(); };
show();
</script>
</body>
</html>
